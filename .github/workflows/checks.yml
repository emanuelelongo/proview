name: Native PDF diagnostics
run-name: Diagnose Windows PDF native crash
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Select C compiler
        shell: pwsh
        run: |
          'C:/mingw64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=C:/mingw64/bin/gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:/mingw64/bin/g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile native test executable
        run: |
          mkdir -p build/native-diagnostics
          go test -c -o build/native-diagnostics/pdfengine.test.exe ./internal/pdfengine
      - name: Debug rejection paths
        run: |
          if command -v gdb > /dev/null; then
            cd internal/pdfengine
            cat > ../../build/native-diagnostics/commands.gdb <<'GDB'
            set pagination off
            set print thread-events off
            set auto-load python-scripts off
            run
            bt 24
            info registers
            thread apply all bt 16
          GDB
            gdb -nx --batch -x ../../build/native-diagnostics/commands.gdb \
              --args ../../build/native-diagnostics/pdfengine.test.exe -test.v -test.count=100 \
              -test.timeout=5m -test.run '^TestTextCorrectionTaggedMoveRejects'
          else
            echo 'GDB unavailable'
          fi
      - name: Exercise rejection paths without a debugger
        run: go test -v -count=100 -run '^TestTextCorrectionTaggedMoveRejects' -timeout 5m ./internal/pdfengine
      - name: All native tests without a debugger
        run: go test -v -count=10 -shuffle=on -timeout 5m ./internal/pdfengine
