name: Pull request checks
run-name: 'Checks for PR #${{ github.event.pull_request.number }}'

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.target.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macOS ARM64
            os: macos-15
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: amd64
          - name: Windows x64
            os: windows-2022
            arch: amd64
          - name: Linux x64
            os: ubuntu-22.04
            arch: amd64
          # Keep the native MuPDF tests on a compatible glibc baseline.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.target.arch }}
    steps:
      # On pull_request, checkout tests GitHub's proposed merge commit.
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc g++ libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Select runner Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Match MuPDF's compatible MinGW runtime used by release builds.
          $compiler = 'C:/mingw64/bin/gcc.exe'
          if (!(Test-Path $compiler)) { throw 'The runner MinGW compiler is missing.' }
          'C:/mingw64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:/mingw64/bin/g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Go tests including native PDF security checks
        id: tests
        run: go test -timeout 10m ./...
      - name: Go vet
        id: vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Logging race tests
        id: race
        if: ${{ !cancelled() }}
        run: go test -race -timeout 5m ./internal/applog
      - name: Go formatting
        id: formatting
        if: ${{ !cancelled() && matrix.target.os == 'ubuntu-22.04' }}
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '::error::Run gofmt on the following files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Build and release tooling tests
        id: tooling
        if: ${{ !cancelled() && matrix.target.os == 'ubuntu-22.04' }}
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - name: Check summary
        if: always()
        env:
          TARGET_NAME: ${{ matrix.target.name }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          VET_RESULT: ${{ steps.vet.outcome }}
          RACE_RESULT: ${{ steps.race.outcome }}
          FORMATTING_RESULT: ${{ steps.formatting.outcome }}
          TOOLING_RESULT: ${{ steps.tooling.outcome }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          rows = [
              ("Go tests (including native PDF security)", "TESTS_RESULT"),
              ("Go vet", "VET_RESULT"),
              ("Logging race tests", "RACE_RESULT"),
              ("Go formatting (Linux x64)", "FORMATTING_RESULT"),
              ("Build/release tooling tests (Linux x64)", "TOOLING_RESULT"),
          ]
          summary = "## " + os.environ["TARGET_NAME"] + "\n\n| Check | Result |\n| --- | --- |\n"
          summary += "".join(f"| {label} | {os.environ[key]} |\n" for label, key in rows)
          summary += "\nPull request validation only. No application binaries, packages or releases are produced.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write(summary)
          PYTHON

  pr-checks:
    name: PR checks
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all targets
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          result = os.environ["TESTS_RESULT"]
          summary = "## Pull request checks\n\n"
          summary += f"Cross-platform test matrix: **{result}**.\n\n"
          summary += "Review the individual target checks for test logs and verification summaries.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write(summary)
          if result != "success":
              raise SystemExit("::error::All pull request test targets must pass.")
          PYTHON
